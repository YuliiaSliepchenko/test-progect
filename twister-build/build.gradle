plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.2.0'
group = 'com.leonard.twister'
base { archivesName = 'TwisterPort-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client { workingDirectory project.file('run'); property 'forge.logging.console.level', 'info'; mods { twister { source sourceSets.main } } }
        server { workingDirectory project.file('run'); property 'forge.logging.console.level', 'info'; args '--nogui'; mods { twister { source sourceSets.main } } }
    }
}

repositories { }

dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version: '1.20.1', forge_version: '47.4.10', mod_id: 'twister', mod_name: 'Twister Port', mod_version: project.version]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) { expand replaceProperties + [project: project] }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
    manifest {
        attributes(['Specification-Title': 'twister', 'Specification-Vendor': 'Leonard port', 'Specification-Version': '1', 'Implementation-Title': project.name, 'Implementation-Version': project.jar.archiveVersion, 'Implementation-Vendor': 'Leonard port'])
    }
}
